# Plain HTTP on purpose: this container is only reachable from the Pi itself
# (bound to 127.0.0.1 in docker-compose.yml). HTTPS is provided by
# `tailscale serve`, which terminates TLS with a Let's Encrypt certificate.
server {
    listen 80;

    # 0 = no nginx limit; the backend still enforces MAX_UPLOAD_MB itself.
    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Stream big uploads/downloads instead of buffering them on the SD card.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
